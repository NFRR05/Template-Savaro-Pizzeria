    <style>

<body>

        <div class="nav-right">

                <div class="hamburger-icon">
                    <span style="background: #1A1717;"></span>
                    <span style="background: #1A1717;"></span>
                </div>
            </button>
        </div>
    </header>

    <!-- Side Navigation Drawer -->
    <div class="menu-overlay" id="menuOverlay"></div>
    <div class="menu-wrapper" id="menuDrawer">
        <nav class="drawer-nav">
            <ul class="drawer-links">
                <li><a href="index.html#about">ABOUT</a></li>
                <li><a href="index.html#menu">OUR MENU</a></li>
                <li><a href="index.html#location">LOCATION</a></li>
            </ul>
        </nav>

        <div class="drawer-cta-wrapper" style="margin: 24px 0;">
            <a href="index.html#reservation" class="hero-btn drawer-cta-btn" style="text-decoration: none; display: inline-flex;">
                <div class="btn-text-wrapper">
                    <span class="btn-text">BOOK A TABLE</span>
                </div>
                <div class="btn-icon-wrapper">
                    <svg class="btn-arrow-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="7" y1="17" x2="17" y2="7"></line>
                        <polyline points="7 7 17 7 17 17"></polyline>
                    </svg>
                </div>
            </a>
        </div>

        <div class="drawer-divider"></div>
        <div class="drawer-footer">
            <a href="index.html#reservation" class="drawer-footer-link">CONTACT</a>
            <a href="privacy-policy.html" class="drawer-footer-link">PRIVACY</a>
        </div>
    </div>

    <!-- Clean 404 Section -->
    <section class="error-clean-section">
        <div style="max-width: 600px; width: 100%;">
            <div class="error-num">404</div>
            <h1 class="error-clean-title">Page Not Found</h1>
            <p class="error-clean-desc">The page you are looking for does not exist or has been moved. Return home or reserve a table with us.</p>
            
            <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
                <a href="index.html#reservation" class="hero-btn" style="text-decoration:none;">
                    <div class="btn-text-wrapper">
                        <span class="btn-text">BOOK A TABLE</span>
                    </div>
                    <div class="btn-icon-wrapper">
                        <svg class="btn-arrow-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="7" y1="17" x2="17" y2="7"></line>
                            <polyline points="7 7 17 7 17 17"></polyline>
                        </svg>
                    </div>
                </a>

                <a href="index.html" class="hero-btn" style="text-decoration:none; background: transparent; border: 1px solid #1A1717;">

                        <span class="btn-text" style="color: #1A1717;">Back to Home</span>
                    </div>
                    <div class="btn-icon-wrapper" style="background: #1A1717;">
                        <svg class="btn-arrow-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- Footer -->

    </footer>

    <!-- Script for Menu Drawer Toggle -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const menuDrawer = document.getElementById('menuDrawer');
        const menuOverlay = document.getElementById('menuOverlay');

        function toggleMenu() {
            const isOpen = menuDrawer.classList.contains('active');
            if (isOpen) {
                menuToggle.classList.remove('active');
                menuDrawer.classList.remove('active');
                menuOverlay.classList.remove('active');
                document.body.style.overflow = '';
            } else {
                menuToggle.classList.add('active');
                menuDrawer.classList.add('active');
                menuOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        }

        menuToggle.addEventListener('click', toggleMenu);
        menuOverlay.addEventListener('click', toggleMenu);
    </script>
</body>
</html>
